baseURL = 'https://shura-turtle.github.io/'
locale = 'en'
title = 'shura-turtle'
theme = 'hugo-theme-reimu'

defaultContentLanguage = 'en'
[languages]
[languages.en]
label = 'English'
weight = 1
[languages.zh-CN]
label = '简体中文'
weight = 1
hasCJKLanguage = true
[languages.zh-TW]
label = '繁體中文'
weight = 1
hasCJKLanguage = true
[languages.ja]
label = '日本語'
weight = 1
hasCJKLanguage = true

[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]

[markup.highlight]
guessSyntax = true
noClasses = false

[outputs]
home = ["Algolia", "HTML", "RSS"]

[outputFormats.Algolia]
baseName = "algolia"
isPlainText = true
mediaType = "application/json"
notAlternative = true
