<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost / Comet — animation preview</title>
<link rel="stylesheet" href="css/comet-loader.css"><link rel="stylesheet" href="css/ghost-loader.css">
<style>
:root{color-scheme:dark;--bg:#0b1726;--fg:#c4e5f2;--line:#31536b;--panel:#142638}
:root[data-theme="light"]{color-scheme:light;--bg:#edf6fa;--fg:#203953;--line:#90b5c7;--panel:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:13px/1.6 monospace;padding:24px}main{width:min(100%,460px);text-align:center}h1{font-size:24px;letter-spacing:-1px;margin:0}p{opacity:.7}nav,.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:24px 0}button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 18px;cursor:pointer}button[aria-pressed="true"]{border-color:#48b5e0;box-shadow:inset 0 -2px #48b5e0}button:focus-visible{outline:2px solid #48b5e0;outline-offset:4px}.stage{height:280px;display:grid;place-items:center;border:1px solid var(--line);border-radius:16px;background:var(--panel)}[hidden]{display:none!important}.paused .stage *{animation-play-state:paused!important}.motion-note{font-size:11px;display:none}@media(prefers-reduced-motion:reduce){.motion-note{display:block}}
</style></head><body><main>
<h1 id="preview-title">Pixel ghost</h1><p>A little haunted. Full of character.</p>
<nav aria-label="Animation style"><button data-style="ghost" aria-pressed="true">Ghost</button><button data-style="comet" aria-pressed="false">Comet</button></nav>
<div class="stage"><div id="ghost-preview"><div class="ghost-loader" aria-hidden="true"><div class="ghost-shadow"></div><div class="ghost-arrival"><div class="ghost-sprite"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 36" fill="none" shape-rendering="crispEdges">
  <path fill="#69b7d5" d="M12 3h8v2h4v3h3v4h2v18h-5v-3h-4v3h-8v-3H8v3H3V12h2V8h3V5h4z"/>
  <path fill="#e3f8ff" d="M12 5h8v2h4v3h2v17h-3v-3h-5v3h-5v-3H7v3H5V12h2V9h3V7h2z"/>
  <path fill="#b7e7f5" d="M24 10h2v17h-3v-3h-5v3h-5v-3H7v3H5v-5h16v-3h3z"/>
  <path fill="#fff" d="M10 9h4v2h-4zM8 11h2v4H8z"/>
  <g class="ghost-eyes">
    <path fill="#17384e" d="M10 13h4v7h-4zm9 0h4v7h-4z"/>
    <path fill="#fff" d="M10 13h2v2h-2zm9 0h2v2h-2z"/>
  </g>
  <path fill="#69b7d5" d="M7 21h3v2H7zm17 0h3v2h-3z"/>
  <g class="ghost-hem"><path fill="#b7e7f5" d="M5 27h3v3H5zm8 0h5v3h-5zm10 0h3v3h-3z"/></g>
</svg></div></div><span class="ghost-spark ghost-spark-one"></span><span class="ghost-spark ghost-spark-two"></span><span class="ghost-spark ghost-spark-three"></span><span class="ghost-spark ghost-spark-four"></span></div></div><div id="comet-preview" hidden><div class="comet-loader" aria-hidden="true"><div class="comet-orbit comet-orbit-outer"></div><div class="comet-orbit comet-orbit-inner"></div><div class="comet-core"></div></div></div></div>
<div class="controls"><button id="replay-preview">Replay</button><button id="pause-preview" aria-pressed="false">Pause</button><button id="theme-preview">Light mode</button></div>
<p class="motion-note">Animations are still because your device prefers reduced motion.</p>
</main><script>
document.querySelectorAll('[data-style]').forEach(button=>button.addEventListener('click',()=>{
 const ghost=button.dataset.style==='ghost';
 document.getElementById('ghost-preview').hidden=!ghost;
 document.getElementById('comet-preview').hidden=ghost;
 document.getElementById('preview-title').textContent=ghost?'Pixel ghost':'Comet orbit';
 document.querySelector('main > p').textContent=ghost?'A little haunted. Full of character.':'Two trails. Opposite directions.';
 document.querySelectorAll('[data-style]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
}));
document.getElementById('replay-preview').addEventListener('click',()=>{
 document.querySelector('.stage').getAnimations({subtree:true}).forEach(animation=>{animation.currentTime=0;});
});
document.getElementById('pause-preview').addEventListener('click',e=>{
 const paused=document.body.classList.toggle('paused');
 e.currentTarget.textContent=paused?'Play':'Pause';e.currentTarget.setAttribute('aria-pressed',String(paused));
});
document.getElementById('theme-preview').addEventListener('click',e=>{
 const light=document.documentElement.dataset.theme==='dark';
 document.documentElement.dataset.theme=light?'light':'dark';e.currentTarget.textContent=light?'Dark mode':'Light mode';
});
</script></body></html>
