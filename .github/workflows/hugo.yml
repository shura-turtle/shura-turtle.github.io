name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: 0.162.0
      HUGO_ENVIRONMENT: production

    steps:
      # -----------------------------
      # Install Hugo Extended
      # -----------------------------
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"

          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

          hugo version

      # -----------------------------
      # Install Dart Sass
      # -----------------------------
      - name: Install Dart Sass
        run: |
          sudo snap install dart-sass

      # -----------------------------
      # Checkout main website
      # -----------------------------
      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # Checkout Offsec notes repo
      # -----------------------------
      - name: Checkout Offsec notes
        uses: actions/checkout@v4
        with:
          repository: shura-turtle/offsec-n0t3
          path: offsec-n0t3
          fetch-depth: 0

      # -----------------------------
      # Setup GitHub Pages
      # -----------------------------
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # -----------------------------
      # Build main Reimu site
      # -----------------------------
      - name: Build main site
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          hugo \
            --gc \
            --minify \
            --source . \
            --destination ./public \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      # -----------------------------
      # Build Offsec Hugo Book
      # -----------------------------
      - name: Build Offsec notes
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          hugo \
            --gc \
            --minify \
            --source ./offsec-n0t3 \
            --destination ./public/offsec-n0t3 \
            --baseURL "${{ steps.pages.outputs.base_url }}/offsec-n0t3/"

      # -----------------------------
      # Upload combined site
      # -----------------------------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # -----------------------------
  # Deploy to GitHub Pages
  # -----------------------------
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
