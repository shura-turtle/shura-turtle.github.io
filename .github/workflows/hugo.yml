name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: 0.162.0

    steps:
      - name: Install Hugo
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Offsec notes
        uses: actions/checkout@v4
        with:
          repository: shura-turtle/offsec-n0t3
          path: offsec-n0t3
          fetch-depth: 0

      # DEBUG — make sure both Hugo projects actually exist
      - name: Check files
        run: |
          echo "=== MAIN REPO ==="
          pwd
          ls -la
          echo "Main hugo.toml:"
          ls -l hugo.toml

          echo "=== OFFSEC REPO ==="
          ls -la "$GITHUB_WORKSPACE/offsec-n0t3"
          echo "Offsec hugo.toml:"
          ls -l "$GITHUB_WORKSPACE/offsec-n0t3/hugo.toml"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build main site
        run: |
          hugo \
            --source "$GITHUB_WORKSPACE" \
            --destination "$GITHUB_WORKSPACE/public" \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Build Offsec notes
        run: |
          hugo \
            --source "$GITHUB_WORKSPACE/offsec-n0t3" \
            --destination "$GITHUB_WORKSPACE/public/offsec-n0t3" \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/offsec-n0t3/"

      - name: Show generated site
        run: |
          echo "=== PUBLIC ==="
          find "$GITHUB_WORKSPACE/public" -maxdepth 2 -type f | head -100

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
