<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b3048">
  <title>Little Meadow · A moment to wander</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
    :root{color-scheme:dark;--cream:#fff2dc;--muted:#c9b7ce;--line:#fff0dd25}
    *{box-sizing:border-box}body{margin:0;background:#1b3048;color:var(--cream);font-family:'DM Sans',sans-serif;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #f4d99e;outline-offset:5px}
    .world{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
    .veil{position:fixed;inset:0;pointer-events:none;background:linear-gradient(#18172d35,transparent 38%,transparent 70%,#151a2cd9)}
    header{position:absolute;inset:32px 4.5% auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:13px;font-family:'Space Mono',monospace;font-size:13px;letter-spacing:1px}.brand svg{width:27px;height:27px;image-rendering:pixelated}.tag{font-size:10px;letter-spacing:2px;color:var(--muted);font-family:'Space Mono',monospace}.live{display:flex;gap:9px;align-items:center}.dot{height:6px;width:6px;background:#c7dcad;box-shadow:0 0 12px #c7dcad88}
    main{position:absolute;top:16%;left:0;right:0;text-align:center;pointer-events:none;padding:0 20px}.eyebrow{font-family:'Space Mono',monospace;letter-spacing:4px;font-size:10px;color:#e5c7bf}h1{font-family:Georgia,serif;font-size:clamp(44px,6vw,84px);font-weight:400;letter-spacing:-3px;margin:15px 0 14px;line-height:1.1}h1 em{color:#f6c9ba;font-weight:400}main p{font-size:14px;line-height:1.9;color:#e1cdd9;margin:0}.divider{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:23px;font-size:9px;color:#eacaad}.divider:before,.divider:after{content:'';height:1px;width:35px;background:#eacaad55}
    footer{position:absolute;bottom:29px;left:4.5%;right:4.5%}.footer-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:21px}.caption{font-size:12px;color:#eadcdd}.caption span{display:block;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1.2px;color:#b6b4c7;margin-top:8px}.controls{display:flex;gap:9px}.control{border:1px solid var(--line);background:#252a3f99;border-radius:7px;padding:11px 15px;display:flex;align-items:center;gap:9px;font-size:11px;backdrop-filter:blur(12px);transition:background .2s}.control:hover{background:#575068aa}.control svg{width:13px;height:13px}.bottom{border-top:1px solid var(--line);padding-top:17px;display:flex;justify-content:space-between;gap:12px;font-family:'Space Mono',monospace;font-size:9px;color:#aaaabd;letter-spacing:.5px}.heart{color:#e6aba6}.note{position:absolute;top:85px;right:4.5%;font-size:11px;color:#ead6d9;opacity:0;transition:opacity .5s}.note.show{opacity:1}
    @media(max-width:600px){header{top:24px}.tag{font-size:8px;letter-spacing:1px}.brand{font-size:10px;gap:8px}main{top:17%}h1{letter-spacing:-2px}main p{font-size:12px}.eyebrow{font-size:8px;letter-spacing:2px}footer{bottom:22px}.footer-top{align-items:flex-end}.caption{font-size:11px;max-width:145px;line-height:1.6}.caption span{font-size:8px}.control{padding:11px}.control .desktop{display:none}.bottom{font-size:8px}.bottom .extra{display:none}}
  </style>
</head>
<body>
  <canvas class="world" id="world" aria-label="An animated pixel meadow at twilight, with six little animal friends: Mochi the bunny, Maple the fox, Luna the cat, Pip the frog, Honey the bear, and Cloud the penguin." role="img"></canvas>
  <div class="veil"></div>
  <header><div class="brand"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="#bbd5a2" d="M7 7h2v9H7zM3 4h4v2H3zM1 2h4v2H1zM9 3h4v2H9zM11 1h4v2h-4zM5 6h2v2H5zM9 5h2v2H9z"/><path fill="#f3c7ad" d="M6 12h5v2H6zM5 14h7v2H5z"/></svg>LITTLE MEADOW</div><div class="tag live"><span class="dot"></span>A SMALL, HAPPY PLACE</div></header>
  <main><div class="eyebrow">NO HURRY. YOU’RE HERE.</div><h1>A little <em>slower.</em></h1><p>Six little friends. Nowhere to be.<br>Stay awhile, and let the world drift by.</p><div class="divider">✦</div></main>
  <div id="note" class="note" role="status"></div>
  <footer><div class="footer-top"><div class="caption">Good company. Quiet moments.<span id="scene-label">01 / THE TWILIGHT MEADOW</span></div><div class="controls"><button class="control" id="theme" aria-label="Switch to morning"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12.5 10.5A6 6 0 0 1 5.5 3a6 6 0 1 0 7 7.5Z"/></svg><span id="theme-label">Twilight</span></button><button class="control" id="pause" aria-label="Pause animation" aria-pressed="false"><span id="pause-icon" aria-hidden="true">Ⅱ</span><span class="desktop" id="pause-label">Pause</span></button></div></div><div class="bottom"><span>MADE FOR DOING A LITTLE LESS.</span><span class="extra">SIX FRIENDS · ONE LITTLE WORLD</span><span>TAKE A BREATH <span class="heart">♥</span></span></div></footer>
  <script src="static/js/meadow.js" defer></script>
</body>
</html>
